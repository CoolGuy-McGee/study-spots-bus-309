<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <title>Study Spots | BYU-Idaho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Campus Study Spot Finder home"><img src="./img/site_logo.png" alt="Campus Study Spot Finder" /></a>
        <div class="toolbar">
          <label class="search-box" for="search-input"><span class="search-icon">⌕</span><input id="search-input" type="search" placeholder="Search for a study spot..." autocomplete="off" /></label>
          <button class="filters-button" id="filters-button" type="button" aria-expanded="false" aria-controls="filter-panel"><span aria-hidden="true">☷</span> Filters</button>
        </div>
      </header>

      <main class="workspace">
        <section class="map-stage" aria-label="Study spots map">
          <div id="map"></div>
          <button class="locate-button" id="campus-button" type="button" aria-label="Recenter on campus">◎</button>
          <div class="map-status"><span id="status-copy">43 spots</span></div>
          <aside class="detail-panel" id="detail-panel" aria-live="polite"><button class="close-detail" id="close-detail" type="button" aria-label="Close spot details">×</button><div class="detail-empty"><div class="empty-icon">↗</div><p class="eyebrow">Spot details</p><h2>Pick a pin<br /><em>to peek inside.</em></h2><p>Choose a spot from the list or map to see its ratings, amenities, and notes.</p></div></aside>
        </section>
      </main>
    </div>
    <div class="filter-backdrop" id="filter-backdrop"></div>
    <aside class="filter-panel" id="filter-panel" aria-label="Study spot filters" aria-hidden="true">
      <div class="filter-panel-header"><div><p class="filter-eyebrow">Refine your study spot</p><h2>Filters</h2></div><button class="filter-close" id="filter-close" type="button" aria-label="Close filters">×</button></div>
      <div class="filter-panel-body" id="filter-controls"></div>
      <div class="filter-panel-footer"><button class="clear-filters" id="clear-filters" type="button">Clear all</button><button class="show-spots" id="show-spots" type="button">Show <span id="filter-count">43</span> spots</button></div>
    </aside>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
