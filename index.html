<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <title>Study Spots | BYU-Idaho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Campus Study Spot Finder home"><span class="brand-mark">⌖</span><strong>Campus Study Spot Finder</strong></a>
        <nav class="topnav" aria-label="Primary navigation"><a class="active" href="#map">Map</a><a href="#saved">Saved Spots</a><button class="menu-button" type="button" aria-label="Open menu">☰</button></nav>
      </header>

      <main class="workspace">
        <div class="toolbar">
          <label class="search-box" for="search-input"><span class="search-icon">⌕</span><input id="search-input" type="search" placeholder="Search for a study spot..." autocomplete="off" /></label>
          <div class="filter-row" role="group" aria-label="Spot filters">
            <button class="filter-chip active" data-filter="all" type="button">All</button>
            <button class="filter-chip" data-filter="Library" type="button">Library</button>
            <button class="filter-chip" data-filter="Inside" type="button">Indoor</button>
            <button class="filter-chip" data-filter="Outside" type="button">Outdoor</button>
            <button class="filter-chip" data-filter="Quiet" type="button">Quiet</button>
            <button class="filter-chip" data-filter="Group" type="button">Group</button>
          </div>
        </div>
        <section class="map-stage" aria-label="Study spots map">
          <div id="map"></div>
          <button class="locate-button" id="campus-button" type="button" aria-label="Recenter on campus">◎</button>
          <div class="map-status"><span id="status-copy">43 spots</span><span>·</span><span>Demo coordinates</span></div>
          <aside class="detail-panel" id="detail-panel" aria-live="polite"><button class="close-detail" id="close-detail" type="button" aria-label="Close spot details">×</button><div class="detail-empty"><div class="empty-icon">⌖</div><h2>Select a spot</h2><p>Choose a pin to view study spot details.</p></div></aside>
        </section>
      </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
